spring:
  application:
    name: shoppy-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/shoppy_db
    username: shoppy_user
    password: shoppy_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

server:
  port: 8080
