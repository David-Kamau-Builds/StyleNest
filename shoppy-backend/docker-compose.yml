version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: shoppy_postgres
    environment:
      POSTGRES_USER: shoppy_user
      POSTGRES_PASSWORD: shoppy_password
      POSTGRES_DB: shoppy_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
