name: Mobile CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'shoppy-mobile/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradlew'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - 'shoppy-mobile/**'
      - 'gradle/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradlew'
      - '.github/workflows/mobile-ci.yml'

jobs:
  build-and-test:
    name: Build, Lint, and Test Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Run Android Lint
        run: ./gradlew :shoppy-mobile:lintDebug

      - name: Run Local Unit Tests
        run: ./gradlew :shoppy-mobile:testDebugUnitTest

      - name: Build Debug APK
        run: ./gradlew :shoppy-mobile:assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: shoppy-mobile-debug-apk
          path: shoppy-mobile/build/outputs/apk/debug/*.apk
          if-no-files-found: error
